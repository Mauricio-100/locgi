name: Train and Upload Locgi Model

on:
  workflow_dispatch:  # Déclenchement manuel depuis l'onglet Actions
  schedule:
    - cron: '* * * * *'  # Optionnel : tous les dimanches à 3h

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch safetensors huggingface_hub pandas pyarrow

      - name: Run training script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python embeling_soul.py
