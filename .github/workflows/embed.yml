name: Train & Push Gopu Model

on:
  schedule:
    - cron: '*/2 * * * *'  # Toutes les 2 minutes
  workflow_dispatch:       # Déclenchement manuel

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # 1. Cloner le repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installer les dépendances
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch safetensors huggingface_hub pandas pyarrow wget

      # 4. Exécuter le script (qui utilise le token depuis les secrets)
      - name: Run embeling_soul.py
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python embeling_soul.py

      # 5. Commit et push les fichiers modifiés (corpus.txt, vocab.json, config.json, gopu_poids.safetensors)
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus.txt vocab.json config.json gopu_poids.safetensors
          git diff --staged --quiet || git commit -m "Auto-update model $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
